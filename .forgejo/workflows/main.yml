name: Release Creation

on:
  push:
    tags: 'v*'

jobs:
  publish:
    runs-on: codeberg-tiny
    steps:
      - name: Checkout repository
        uses: actions/checkout@v7

      # Set up Node
      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: "npm"

      # `npm ci` is recommended:
      # https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-nodejs
      - name: Install Dependencies
        run: npm ci

      # Run build scripts
      - name: Build All
        run: |
          npm run build
          mv --force public/boundless.mjs boundless.mjs

      # Create zip file.
      - name: Create ZIP archive
        run: |
          mkdir release
          zip -r ./release/system.zip system.json boundless.mjs boundless.css assets/ lang/ templates/

      # Create a release for this specific version.
      - name: Update Release with Files
        id: create_version_release
        uses: https://code.forgejo.org/actions/forgejo-release@v2.5.0
        with:
          url: "https://codeberg.org"
          repo: "CreggHancock/foundryvtt-boundless"
          direction: upload
          token: ${{ secrets.TOKEN }}
          override: ${{ vars.OVERRIDE || "false" }}
          verbose: ${{ vars.VERBOSE || "false" }}
          artifacts: "./system.json, ./system.zip"
          tag: "${{ github.ref_name }}"
          body: ${{ github.event.release.body }}
          release-dir: release
          hide-archive-link: true
          release-notes-assistant: true
